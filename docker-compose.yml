version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/data.json:/app/data.json
    networks:
      - app-net

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

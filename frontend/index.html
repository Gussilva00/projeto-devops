<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Projeto DevOps - Frontend</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, textarea { width: 300px; display:block; margin-bottom:8px; }
    .item { border-bottom: 1px solid #ddd; padding:8px 0; }
    button { margin-right: 6px; }
  </style>
</head>
<body>
  <h1>Projeto DevOps — Frontend</h1>

  <h2>Criar item</h2>
  <form id="createForm">
    <input id="title" placeholder="Título" required />
    <textarea id="description" placeholder="Descrição"></textarea>
    <button type="submit">Criar</button>
  </form>

  <h2>Itens</h2>
  <div id="items"></div>

<script>
const API = (location.hostname === 'localhost' ? 'http://localhost:3000' : `${location.protocol}//${location.hostname}:3000`);

async function fetchItems() {
  const res = await fetch(API + '/items');
  const items = await res.json();
  const container = document.getElementById('items');
  container.innerHTML = items.map(i => `
    <div class="item" data-id="${i.id}">
      <strong>#${i.id} ${i.title}</strong>
      <p>${i.description || ''}</p>
      <button onclick="editItem(${i.id})">Editar</button>
      <button onclick="deleteItem(${i.id})">Excluir</button>
    </div>
  `).join('');
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('title').value;
  const description = document.getElementById('description').value;
  await fetch(API + '/items', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, description })
  });
  document.getElementById('title').value = '';
  document.getElementById('description').value = '';
  fetchItems();
});

async function editItem(id) {
  const title = prompt('Novo título:');
  if (title === null) return;
  const description = prompt('Nova descrição:');
  await fetch(API + '/items/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, description })
  });
  fetchItems();
}

async function deleteItem(id) {
  if (!confirm('Confirmar exclusão?')) return;
  await fetch(API + '/items/' + id, { method: 'DELETE' });
  fetchItems();
}

fetchItems();
</script>
</body>
</html>
